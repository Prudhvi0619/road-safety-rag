[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "road-safety-rag"
version = "2.3.0"
description = "Evidence-first offline RAG for Indian road-safety audit measurements"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "pandas>=2.2,<4",
  "openpyxl>=3.1,<4",
  "pypdf>=5.1,<7",
  "protobuf>=4.25.8,<7",
]

[project.optional-dependencies]
rag = [
  "chromadb>=0.5.23,<2",
  "sentence-transformers>=3.3,<6",
  "langchain-core>=0.3.28,<2",
  "langchain-chroma>=0.2.2,<2",
  "langchain-huggingface>=0.1.2,<2",
]
ocr = ["docling>=2.15,<3"]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1"]

[project.scripts]
road-safety-rag = "road_safety_rag.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]
